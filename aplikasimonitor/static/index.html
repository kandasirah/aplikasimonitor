<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikasi Monitor</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◧</span>
    <div>
      <h1>Aplikasi Monitor</h1>
      <p class="muted" id="host-line">memuat…</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="uptime">
      <span class="muted">Uptime</span>
      <strong id="uptime">—</strong>
    </div>
    <div class="conn">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">menyambung…</span>
    </div>
    <div class="clock" id="clock">—</div>
  </div>
</header>

<main>

  <!-- Ringkasan resource -->
  <section class="stats" id="stats">
    <article class="card stat" data-key="cpu">
      <span class="stat-label">CPU</span>
      <span class="stat-value" id="cpu-value">—</span>
      <span class="stat-sub" id="cpu-sub">—</span>
      <div class="bar"><i id="cpu-bar" style="width:0"></i></div>
    </article>
    <article class="card stat" data-key="mem">
      <span class="stat-label">Memori</span>
      <span class="stat-value" id="mem-value">—</span>
      <span class="stat-sub" id="mem-sub">—</span>
      <div class="bar"><i id="mem-bar" style="width:0"></i></div>
    </article>
    <article class="card stat" data-key="swap">
      <span class="stat-label">Swap</span>
      <span class="stat-value" id="swap-value">—</span>
      <span class="stat-sub" id="swap-sub">—</span>
      <div class="bar"><i id="swap-bar" style="width:0"></i></div>
    </article>
    <article class="card stat" data-key="disk">
      <span class="stat-label">Disk /</span>
      <span class="stat-value" id="disk-value">—</span>
      <span class="stat-sub" id="disk-sub">—</span>
      <div class="bar"><i id="disk-bar" style="width:0"></i></div>
    </article>
    <article class="card stat" data-key="temp">
      <span class="stat-label">Suhu CPU</span>
      <span class="stat-value" id="temp-value">—</span>
      <span class="stat-sub" id="temp-sub">—</span>
    </article>
    <article class="card stat" data-key="fan">
      <span class="stat-label">Kipas</span>
      <span class="stat-value" id="fan-value">—</span>
      <span class="stat-sub" id="fan-sub">—</span>
    </article>
    <article class="card stat" data-key="battery">
      <span class="stat-label">Baterai</span>
      <span class="stat-value" id="bat-value">—</span>
      <span class="stat-sub" id="bat-sub">—</span>
      <div class="bar"><i id="bat-bar" style="width:0"></i></div>
    </article>
    <article class="card stat" data-key="net">
      <span class="stat-label">Jaringan</span>
      <span class="stat-value net" id="net-down">—</span>
      <span class="stat-sub" id="net-sub">—</span>
    </article>
  </section>

  <!-- Grafik riwayat -->
  <section class="card chart-card">
    <div class="card-head">
      <h2>Riwayat CPU &amp; Memori</h2>
      <span class="muted" id="chart-hint">60 sampel terakhir</span>
    </div>
    <div class="chart-wrap"><canvas id="history-chart"></canvas></div>
  </section>

  <!-- Panel data bertab -->
  <section class="card tabs-card">
    <div class="tabbar" role="tablist" aria-label="Panel data sistem">
      <button class="tab" role="tab" id="tab-services" aria-controls="panel-services"
              aria-selected="true" data-tab="services">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/></svg>
        <span>Service</span> <span class="pill" id="service-count">—</span>
      </button>
      <button class="tab" role="tab" id="tab-ports" aria-controls="panel-ports"
              aria-selected="false" data-tab="ports" tabindex="-1">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
        <span>Port</span> <span class="pill" id="ports-count">—</span>
      </button>
      <button class="tab" role="tab" id="tab-processes" aria-controls="panel-processes"
              aria-selected="false" data-tab="processes" tabindex="-1">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Proses</span> <span class="pill" id="proc-count">—</span>
      </button>
      <button class="tab" role="tab" id="tab-sensors" aria-controls="panel-sensors"
              aria-selected="false" data-tab="sensors" tabindex="-1">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
        <span>Sensor</span> <span class="pill" id="sensor-count">—</span>
      </button>
      <button class="tab" role="tab" id="tab-logs" aria-controls="panel-logs"
              aria-selected="false" data-tab="logs" tabindex="-1">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Log</span> <span class="live-badge">LIVE</span>
      </button>
    </div>

    <div class="tabpanel" id="panel-services" role="tabpanel" aria-labelledby="tab-services" data-tab="services">
      <div class="panel-tools">
        <input type="search" id="service-search" placeholder="cari service…">
      </div>
      <div class="table-scroll" id="services-body">
        <div class="empty">memuat…</div>
      </div>
    </div>

    <div class="tabpanel" id="panel-ports" role="tabpanel" aria-labelledby="tab-ports" data-tab="ports" hidden>
      <div class="table-scroll" id="ports-body">
        <div class="empty">memuat…</div>
      </div>
    </div>

    <div class="tabpanel" id="panel-processes" role="tabpanel" aria-labelledby="tab-processes" data-tab="processes" hidden>
      <div class="panel-tools">
        <button class="chip" data-sort="cpu" aria-pressed="true">CPU</button>
        <button class="chip" data-sort="mem" aria-pressed="false">RAM</button>
      </div>
      <div class="table-scroll tall" id="processes-body">
        <div class="empty">memuat…</div>
      </div>
    </div>

    <div class="tabpanel" id="panel-sensors" role="tabpanel" aria-labelledby="tab-sensors" data-tab="sensors" hidden>
      <div class="table-scroll tall" id="sensors-body">
        <div class="empty">memuat…</div>
      </div>
    </div>

    <div class="tabpanel" id="panel-logs" role="tabpanel" aria-labelledby="tab-logs" data-tab="logs" hidden>
      <div class="panel-tools">
        <select id="log-unit"><option value="">semua unit</option></select>
        <select id="log-level">
          <option value="">semua level</option>
          <option value="3">err+</option>
          <option value="4">warning+</option>
          <option value="6">info+</option>
          <option value="7">debug+</option>
        </select>
        <input type="search" id="log-search" placeholder="filter teks…">
        <label class="switch"><input type="checkbox" id="log-autoscroll" checked> auto-scroll</label>
        <button class="chip" id="log-clear">bersihkan</button>
      </div>
      <div class="logs" id="log-body"><div class="empty">menunggu log…</div></div>
    </div>
  </section>

</main>

<div class="toast-wrap" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
